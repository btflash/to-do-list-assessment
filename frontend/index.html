<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Todo List</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="app-header">
        <h1>My Todo List</h1>
        <div class="profile">
            <div class="profile-icon">👤BTP</div>
            <span class="profile-name">Brian T. Puozaa</span>
        </div>
        <h1 class="app-title">My Todo List</h1>
    </header>

    <main>
        <div id="todo-list" class="todo-list">
            <!-- Todo items are inserted here by script.js -->
        </div>
    </main>

    <div class="add-todo">
        <input id="new-todo-title" class="add-todo-input" type="text" placeholder="Task title">
        <input id="new-todo-description" class="add-todo-input" type="text" placeholder="Description">
        <button id="add-todo-button" class="add-todo-button" type="button">+ Add Task</button>
    </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
